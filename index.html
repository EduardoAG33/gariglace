<!DOCTYPE html>
<html lang="es">
<head>
<script>
  /* ============================================================
     CONFIGURACIÓN RÁPIDA — cambia aquí y guarda
     ============================================================ */
  const ESTADO_AGENDA  = "Agenda cerrada, solo pedidos de temporada";
  const AGENDA_ABIERTA = false;  // true = punto verde · false = punto ámbar
  const FONDO_FOTO     = false;  // true = usa fondo.jpg desenfocado en vez de los blobs
  /* ============================================================ */
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gari Glacé · Arte dulce en cada creación</title>
<meta name="description" content="Gari Glacé — galletas decoradas, cupcakes y repostería artesanal en Monterrey, N.L. Cotiza tu pedido por WhatsApp.">
<meta name="theme-color" content="#f9dfe0">
<meta property="og:title" content="Gari Glacé">
<meta property="og:description" content="Arte dulce en cada creación · Galletas decoradas, cupcakes y repostería en Monterrey, N.L.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff6ee;
    --pink: #f9d6da;
    --text: #4a2a20;          /* café oscuro */
    --text-soft: #6e4536;
    --glass-bg: rgba(255,255,255,0.25);
    --glass-border: rgba(255,255,255,0.45);
    --glass-shadow: 0 8px 32px rgba(150,80,90,0.15);
    --glass-blur: blur(16px) saturate(160%);
    --radius: 20px;
    --wa: rgba(37,211,102,0.30);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--cream) 0%, #fde8e4 45%, var(--pink) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Fondo: blobs ----------
     Se usan radial-gradients (bordes suaves "gratis") en lugar de
     filter: blur(), que es costoso en celulares de gama baja. */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    will-change: transform;
    animation: drift 38s ease-in-out infinite alternate;
  }
  .blob.rosa    { background: radial-gradient(circle, rgba(244,143,177,.55) 0%, rgba(244,143,177,0) 65%); top: -25vmax; left: -20vmax; }
  .blob.durazno { background: radial-gradient(circle, rgba(255,183,148,.55) 0%, rgba(255,183,148,0) 65%); top: 30vh; right: -30vmax; animation-duration: 46s; animation-delay: -12s; }
  .blob.dorado  { background: radial-gradient(circle, rgba(240,200,120,.45) 0%, rgba(240,200,120,0) 65%); bottom: -30vmax; left: -15vmax; animation-duration: 52s; animation-delay: -20s; }
  .blob.lila    { background: radial-gradient(circle, rgba(200,170,230,.45) 0%, rgba(200,170,230,0) 65%); top: -10vmax; right: -25vmax; animation-duration: 42s; animation-delay: -6s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(8vw, 6vh) scale(1.08); }
    100% { transform: translate(-6vw, 10vh) scale(.95); }
  }

  /* Alternativa: foto de fondo desenfocada con capa rosada */
  .bg-foto { display: none; }
  body.con-foto .blob { display: none; }
  body.con-foto .bg-foto {
    display: block;
    position: absolute;
    inset: -40px;               /* evita bordes claros por el blur */
    background: url("fondo.jpg") center / cover no-repeat;
    filter: blur(24px);
  }
  body.con-foto .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(255,240,235,.55), rgba(248,200,210,.6));
  }

  /* ---------- Vidrio ---------- */
  .glass {
    position: relative;
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.55);
  }
  /* Brillo sutil en el borde superior */
  .glass::before {
    content: "";
    position: absolute;
    top: 0;
    left: 12%;
    right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
    pointer-events: none;
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(255,255,255,0.85); }
    .btn.wa { background: rgba(225,248,232,0.9); }
  }

  /* ---------- Layout ---------- */
  main {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }

  .card {
    padding: 32px 16px 20px;
    text-align: center;
  }

  .avatar {
    width: 104px;
    height: 104px;
    margin: 0 auto 16px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #f7b7c3, #fcd9b8, #e9c98f);
    box-shadow: 0 6px 20px rgba(150,80,90,.18);
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: #fff7f3;
    font-family: "Fraunces", Georgia, serif;
    font-size: 36px;
    font-weight: 600;
    color: #b45a6a;
    letter-spacing: -1px;
  }
  .avatar-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 2.1rem;
    line-height: 1.1;
    letter-spacing: -.5px;
  }
  .lema {
    margin-top: 6px;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.08rem;
    color: #9a4e5c;
  }
  .desc {
    margin: 12px auto 0;
    max-width: 30ch;
    font-size: .95rem;
    line-height: 1.5;
    color: var(--text-soft);
  }
  .ubicacion {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
    font-size: .88rem;
    font-weight: 600;
    color: var(--text-soft);
  }
  .ubicacion svg { width: 15px; height: 15px; }

  .agenda {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: .84rem;
    font-weight: 700;
    line-height: 1.3;
    text-align: left;
    background: rgba(255,255,255,.4);
    border: 1px solid rgba(255,255,255,.6);
  }
  .agenda .dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #e0a030;
    box-shadow: 0 0 0 3px rgba(224,160,48,.22);
  }
  .agenda.abierta .dot {
    background: #25b864;
    box-shadow: 0 0 0 3px rgba(37,184,100,.22);
  }

  /* ---------- Botones ---------- */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 58px;
    padding: 12px 18px;
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background-color: rgba(255,255,255,.38); transform: translateY(-2px); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid #b45a6a; outline-offset: 3px; }

  .btn .ico {
    flex: none;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: rgba(255,255,255,.5);
  }
  .btn .ico svg { width: 21px; height: 21px; }
  .btn .label { flex: 1; text-align: left; }
  .btn .label small {
    display: block;
    font-weight: 600;
    font-size: .8rem;
    color: var(--text-soft);
    margin-top: 1px;
  }
  .btn .arrow { flex: none; width: 18px; height: 18px; opacity: .55; }

  .btn.wa {
    min-height: 76px;
    padding: 16px;
    gap: 12px;
    font-size: 1.05rem;
    background: var(--wa);
    border-color: rgba(255,255,255,.55);
    box-shadow: 0 10px 34px rgba(37,150,90,.20), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn.wa:hover { background-color: rgba(37,211,102,.38); }
  .btn.wa .ico {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: #25d366;
    color: #fff;
    box-shadow: 0 4px 12px rgba(37,211,102,.35);
  }
  .btn.wa .ico svg { width: 26px; height: 26px; }
  .btn.wa .label small { color: #2f5a3e; }

  .tt .ico { color: #1a1a1a; }
  .ig .ico { color: #c13584; }
  .fb .ico { color: #1877f2; }

  /* ---------- Lo que hacemos ---------- */
  .seccion {
    margin-top: 20px;
    padding: 22px 16px 18px;
  }
  .seccion h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: 1.35rem;
    text-align: center;
    margin-bottom: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(255,255,255,.55), rgba(255,220,225,.4));
    border: 1px solid rgba(255,255,255,.6);
  }
  .item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .item .ph {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 2.6rem;
    padding-bottom: 22px;
  }
  .item figcaption {
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: 6px;
    padding: 5px 8px;
    border-radius: 10px;
    font-size: .8rem;
    font-weight: 700;
    text-align: center;
    background: rgba(255,255,255,.78);
  }

  footer {
    margin-top: 22px;
    text-align: center;
    font-size: .8rem;
    color: var(--text-soft);
  }

  /* ---------- Entrada suave ---------- */
  .fade { animation: up .6s ease both; }
  .links .btn:nth-child(1) { animation-delay: .08s; }
  .links .btn:nth-child(2) { animation-delay: .14s; }
  .links .btn:nth-child(3) { animation-delay: .20s; }
  .links .btn:nth-child(4) { animation-delay: .26s; }
  @keyframes up {
    /* "translate" (no "transform") para no bloquear el efecto hover */
    from { opacity: 0; translate: 0 10px; }
    to   { opacity: 1; translate: 0 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  @media (max-width: 360px) {
    h1 { font-size: 1.85rem; }
    .btn.wa { font-size: 1rem; }
  }
</style>
</head>

<script>
  // Estado de agenda
  document.getElementById("agenda-texto").textContent = ESTADO_AGENDA;
  if (AGENDA_ABIERTA) document.getElementById("agenda").classList.add("abierta");

  // Fondo con foto (opcional)

  document.getElementById("anio").textContent = new Date().getFullYear();
</script>
</body>
